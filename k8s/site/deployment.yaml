# Exercice 4 — Le Deployment de votre site.
# Appliquer avec : kubectl apply -f k8s/site/
# Aide : kubectl explain deployment.spec.template.spec.containers
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
  labels:
    app: site
spec:
  replicas: 3                      # Exercice 5.1 : passé de 1 à 3
  selector:
    matchLabels:
      app: site                    # correspond aux labels du template ci-dessous
  template:
    metadata:
      labels:
        app: site
    spec:
      containers:
        - name: nginx
          image: nginx:1.28        # Exercice 5.2 : mis à jour depuis nginx:1.27
          ports:
            - containerPort: 80    # nginx écoute sur le port 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html   # dossier servi par nginx (cf. exercice 3)
          # Bonus B : Kubernetes n'envoie du trafic qu'aux pods dont la sonde répond
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          # Bonus B : ressources réservées (requests) et plafonds (limits)
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: site-html        # la ConfigMap définie dans configmap.yaml
